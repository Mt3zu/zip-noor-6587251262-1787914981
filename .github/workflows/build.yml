name: Build Noor ZIP Web APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK from complete web project
        run: |
          set -e
          npm install -g cordova
          cordova create noor_app com.noor.app "noor"
          cd noor_app
          cordova platform add android
          mkdir -p res
          if [ -f ../project/icon.png ]; then cp ../project/icon.png res/icon.png; fi
          rm -rf www/*
          cp -a ../project/web/. www/
          test -f www/index.html || test -f www/index.htm
          cat > config.xml <<'EOF'
          <widget id="com.noor.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
              <name>noor</name>
              <description>Complete Web Project APK</description>
              <author>Noor AI Team</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Orientation" value="portrait" />
              <preference name="loadUrlTimeoutValue" value="300000" />
              <platform name="android">
                  <icon src="res/icon.png" />
              </platform>
          </widget>
          EOF
          echo "Web project files:"
          find www -type f | sort | head -300
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-App
          path: noor_app/platforms/android/app/build/outputs/apk/debug/*.apk
